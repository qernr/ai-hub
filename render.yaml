    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_brnz0MCTZR1m@ep-fancy-rice-ajm07gbu.c-3.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: ADMIN_PASSWORD
        value: admin123
      - key: SESSION_SECRET
        value: aihub-prod-secret-render-min32chars-secure
      - key: NEXT_PUBLIC_APP_URL
        value: https://findyorpersonalai.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
